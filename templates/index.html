<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?t={{ cache_buster }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}?t={{ cache_buster }}">
  <title>MizuMori</title>

  <script>
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.location.reload();
      }
      document.getElementById("authCover").remove();
    });

    const theme = localStorage.getItem("PBL:theme");
    document.documentElement.dataset.theme = theme;
  </script>
</head>

<body data-user-role="{{ current_user.role }}">
  <div class="auth-cover" id="authCover">
    <div class="auth-cover__spinner">読み込み中</div>
  </div>

  <div class="home" x-data="home">
    <div class="home__sidebar-overlay" x-show="sidebarOpen" @click="sidebarOpen = false"></div>
    <aside class="home__sidebar" :class="{ 'is-open': sidebarOpen }">
      <div class="sidebar__header">
        <a href="/" class="site-title">
          <img src="{{ url_for('static', filename='images/logo.svg') }}" width="24" height="24" alt="logo" class="logo">
          <h1>MizuMori</h1>
        </a>
        <div class="sidebar__header-actions">
          <div class="site-role" :class="{ 'is-admin': $store.role.role === 'admin' }" x-text="$store.role.label"></div>
          <button class="sidebar__header-close" @click="sidebarOpen = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div class="sidebar__actions">
        <div class="sidebar__action-item">
          <div class="theme-change" x-data="common_theme">
            <button @click="setSystemTheme()">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-device-desktop">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10" />
                <path d="M7 20h10" />
                <path d="M9 16v4" />
                <path d="M15 16v4" />
              </svg>
              <div>システムの設定に従う</div>
            </button>
            <button @click="setLightTheme()">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-sun">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
              </svg>
              <div>ライトモード</div>
            </button>
            <button @click="setDarkTheme()">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-moon">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" />
              </svg>
              <div>ダークモード</div>
            </button>
          </div>
        </div>
        <div class="sidebar__action-item">
          <a href="/admin" class="admin-link" :class="{ 'is-viewer': $store.role.role === 'viewer' }">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-cog">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
              <path d="M6 21v-2a4 4 0 0 1 4 -4h2.5" />
              <path d="M17.001 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M19.001 15.5v1.5" />
              <path d="M19.001 21v1.5" />
              <path d="M22.032 17.25l-1.299 .75" />
              <path d="M17.27 20l-1.3 .75" />
              <path d="M15.97 17.25l1.3 .75" />
              <path d="M20.733 20l1.3 .75" />
            </svg>
            <div>管理者ページ</div>
          </a>
        </div>
        <div class="sidebar__action-item">
          <form action="{{ url_for('logout') }}" method="post" class="logout-form">
            <button type="submit">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-logout">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                <path d="M9 12h12l-3 -3" />
                <path d="M18 15l3 -3" />
              </svg>
              <span>ログアウト</span>
            </button>
          </form>
        </div>
      </div>
    </aside>
    <header class="home__header">
      <button class="header__menu-button" @click="sidebarOpen = !sidebarOpen">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 6l16 0" />
          <path d="M4 12l16 0" />
          <path d="M4 18l16 0" />
        </svg>
      </button>
      <a href="/" class="site-title">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" width="24" height="24" alt="logo" class="logo">
        <h1>MizuMori</h1>
      </a>
      <div class="home__header-spacer"></div>
      <div class="site-role" :class="{ 'is-admin': $store.role.role === 'admin' }" x-text="$store.role.label"></div>
    </header>
    <main class="home__content">
      <section class="plant-image" x-data="plantImage">
        <div class="plant-image__frame">
          <img src="" alt="植物の様子" class="plant-image__img" x-ref="img">
          <div class="plant-image__menu">
            <div class="captured-at" x-text="formatDate(capturedAt, 'YYYY-MM-DD HH:mm')"></div>
            <button class="save-image" title="画像を保存する" :disabled="!imageBlob" @click="saveImage()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-download">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                <path d="M7 11l5 5l5 -5" />
                <path d="M12 4l0 12" />
              </svg>
            </button>
          </div>
        </div>
      </section>
      <section class="system-info">
        <div class="system-info__card system-info__status" x-data="systemStatus">
          <div class="system-info__header">
            <div class="system-info__title">自動給水</div>
          </div>
          <div class="system-info__status-value">稼働中</div>
        </div>
        <div class="system-info__card system-info__history" x-data="systemHistory">
          <input class="hide" type="checkbox" id="historyOpener">
          <div class="system-info__header">
            <div class="system-info__title">給水履歴</div>
            <label for="historyOpener" class="history-list-opener">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-square-chevron-down">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 11l-3 3l-3 -3" />
                <path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" />
              </svg>
            </label>
          </div>
          <div class=" system-info__history-list" x-ref="historyList">
            <template x-for="history in histories">
              <div class="system-info__history-item">
                <div class="watered-at" x-text="formatDate(history.watered_at, 'MM/DD HH:mm')"></div>
                <div class="watering-type" x-text="WATERING_TYPE[history.watering_type]"></div>
                <div class="amount-ml">
                  <span x-text="history.amount_ml"></span>
                  <span>ml</span>
                </div>
              </div>
            </template>
            <button class="system-info__history-more" @click="showMoreHistory()" :disabled="histories.length >= total" x-ref="historyItem">
              <template x-if=" histories.length < total">
                <span>さらに表示</span>
              </template>
              <template x-if=" histories.length >= total">
                <span>全履歴を表示しました</span>
              </template>
            </button>
          </div>
        </div>
      </section>
      <section class="sensor-values" x-data="sensorValues">
        <div class="sensor-values__measured-at" x-text="formatDate(measuredAt, 'YYYY-MM-DD HH:mm') || 'センサーを起動しています...'"></div>
        <div class="sensor-values__cards">
          <div class="sensor-card">
            <span class="sensor-type">土壌水分量</span>
            <span class="sensor-value">
              <span x-text="soilMoisture ?? '--'"></span>
              <span class="unit">%</span>
            </span>
          </div>
          <div class="sensor-card">
            <span class="sensor-type">温度</span>
            <span class="sensor-value">
              <span x-text="temperature ?? '--'"></span>
              <span class="unit">℃</span>
            </span>
          </div>
          <div class="sensor-card">
            <span class="sensor-type">湿度</span>
            <span class="sensor-value">
              <span x-text="humidity ?? '--'"></span>
              <span class="unit">%</span>
            </span>
          </div>
          <div class="sensor-card">
            <span class="sensor-type">湿度</span>
            <span class="sensor-value">
              <span x-text="humidity ?? '--'"></span>
              <span class="unit">%</span>
            </span>
          </div>
        </div>
        <div class="sensor-values__detail">
          detail
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}?t={{ cache_buster }}" type="module" defer></script>
  <script src="{{ url_for('static', filename='js/home.js') }}?t={{ cache_buster }}" type="module" defer></script>
  <script src="{{ url_for('static', filename='js/alpine.js') }}" defer></script>
</body>

</html>
