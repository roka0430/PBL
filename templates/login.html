<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <title>PBL6 | Login</title>

  <script>
    const theme = localStorage.getItem("PBL:theme");

    if (theme == "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>

<body>
  <h1>PBL6 Login</h1>

  <div x-data="themeChange">
    <button @click="toggleTheme()">
      <span x-text="isDark ? 'light' : 'dark'"></span>
    </button>
  </div>

  <form method="post" action="/login">
    <input type="password" name="password">
    <button type="submit">ログイン</button>
  </form>
  <div>{{ error }}</div>

  <script src="{{ url_for('static', filename='js/login.js') }}" type="module" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
