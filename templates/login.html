<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <title>PBL6 | Login</title>

  <script>
    const theme = localStorage.getItem("PBL:theme");
    document.documentElement.dataset.theme = theme;
  </script>
</head>

<body>

  <div class="login">
    <div class="login__box">
      <header class="login__header">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" width="40" height="40" alt="logo" class="logo">
        <h2>ログイン</h2>
        <p>パスワードを入力してログイン</p>
      </header>
      <div class="login__content">
        <p class="password__error">{{ error }}</p>
        <form method="post" action="/login">
          <div class="login__password" x-data="{ showPassword: false }">
            <input type="password" name="password" class="login__password-input" placeholder="パスワード" autocomplete="current-password" autofocus required :type="showPassword ? 'text' : 'password'">
            <button type="button" class="login__password-toggle" @click="showPassword = !showPassword">
              <template x-if="showPassword">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                  <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
                </svg>
              </template>
              <template x-if="!showPassword">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye-off">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" />
                  <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" />
                  <path d="M3 3l18 18" />
                </svg>
              </template>
            </button>
          </div>
          <button type="submit" name="role" value="viewer" class="login__submit-viewer">ログイン</button>
          <button type="submit" name="role" value="admin" class="login__submit-admin">管理者としてログイン</button>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}" type="module" defer></script>
  <script src="{{ url_for('static', filename='js/login.js') }}" type="module" defer></script>
  <script src="{{ url_for('static', filename='js/alpine.js') }}" defer></script>
</body>

</html>
